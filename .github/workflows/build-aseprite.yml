name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-aseprite.yml'  # Only trigger when this workflow file changes
  schedule:
    - cron: '0 8 * * *' # Check once daily at UTC 8:00
  workflow_dispatch:       # Keep manual trigger

env:
  BUILD_TYPE: Release
  SKIA_VERSION: m124-08a5439a6b

jobs:
  check-new-release:
    name: Check for new Aseprite release
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Fetch latest Aseprite release tag
        id: aseprite-link
        run: |
          TAG=$(curl -s https://api.github.com/repos/aseprite/aseprite/releases/latest | jq -r '.tag_name')
          echo "Latest Aseprite release: $TAG"
          echo "release-tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.aseprite-link.outputs.release-tag }}"
          echo "Latest upstream tag: $TAG"

          # Check if this repo already has a release with Windows zip for this tag
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "Windows"; then
            echo "Already built $TAG for Windows, skipping."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG detected, will build."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check-new-release
    if: needs.check-new-release.outputs.should-build == 'true'
    permissions:
      contents: write
    outputs:
      release-tag: ${{ needs.check-new-release.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-new-release.outputs.release-tag }}
          body: Aseprite-${{ needs.check-new-release.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (Windows)
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          curl -L -o Skia-Windows-Release-x64.zip https://github.com/aseprite/skia/releases/download/${{ env.SKIA_VERSION }}/Skia-Windows-Release-x64.zip
          unzip Skia-Windows-Release-x64.zip -d skia
      - uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64)
      - name: Compiling
        shell: bash
        working-directory: aseprite/build
        run: ninja
      - name: Clean up build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite.exe' -o -name 'data' -prune \) -exec rm -rf {} +
      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
      - name: Create release zip
        working-directory: aseprite/build/bin
        run: 7z -tzip a Aseprite-${{ needs.create-release.outputs.release-tag }}-Windows.zip *
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.create-release.outputs.release-tag }}-Windows.zip
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-Windows.zip
          tag: ${{ needs.create-release.outputs.release-tag }}
